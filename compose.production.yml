name: watched-production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production.local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 5

  api:
    image: watched-api:local
    pull_policy: never
    env_file:
      - .env.production.local
    ports:
      - '127.0.0.1:33010:33010'
    volumes:
      - uploads:/app/packages/api/uploads
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:' + process.env.PORT)
        .then(r => process.exit(r.ok ? 0 : 1))
        .catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
